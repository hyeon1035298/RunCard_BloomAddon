# The add-on's names, set here only. build.sh hands this file to PillTaskbar's
# tools/build-addon.sh, whose addon/addon.conf describes every key.
# Paths are relative to this file's folder. Lists are space separated.
# Its names (작업 카드, Task Cards) are set here; renaming it changes this file and the schema's names only.

ADDON_ID="run-card"
ADDON_NAME="RunCard"
ADDON_VERSION="0.1.1"
ADDON_MOD_SRC="mod/run-card.wh.cpp"
ADDON_MOD_VERSION="0.1.1"
# Never a Windhawk mod; an id no one uses keeps the Windhawk check quiet.
ADDON_WINDHAWK_MODS="local@run-card"
# The mod hooks nothing and names no symbols: with no modules here the host skips
# symbol preparation (no download) and injects at once. Set, but empty.
ADDON_SYMBOL_MODULES=""
# The schema (cards, and pill.theme, which Bloom sets to its own look) is this folder's
# settings.schema.json; build.sh adds it to the bundle.
ADDON_SCHEMA="0"
ADDON_VALUES_DEFAULTS=""
ADDON_THIRD_PARTY="THIRD_PARTY.md"

# addon.json
ADDON_NAME_KO="작업 카드"
ADDON_NAME_EN="Task Cards"
ADDON_ABOUT_KO="Claude Code 세션마다 지금 하는 일과 단계를 카드로 띄우고, 승인과 질문에 카드에서 바로 답합니다"
ADDON_ABOUT_EN="Shows current tasks and steps as cards for each Claude Code session, and lets you answer approvals and questions right from the card"
ADDON_LICENSE="GPL-3.0-only"
ADDON_SOURCE="https://github.com/hyeon1035298/RunCard_BloomAddon"
ADDON_MIN_BLOOM="1.4.3"
ADDON_NEEDS=""
